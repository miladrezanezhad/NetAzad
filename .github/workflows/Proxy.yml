name: 🎮 Interactive Web Controller

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Target URL'
        required: true
        default: 'https://deepseek.com'
        type: string
      actions:
        description: 'Actions to perform (click, type, scroll, screenshot, wait)'
        required: false
        default: 'wait:3;screenshot;scroll:500;click:.button;screenshot'
        type: string

jobs:
  interact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Puppeteer
        run: |
          npm install puppeteer
          npx puppeteer browsers install chrome
          
      - name: Interactive Browser Session
        run: |
          cat > interact.js << 'EOF'
          const puppeteer = require('puppeteer');
          
          const url = process.env.URL;
          const actionsStr = process.env.ACTIONS;
          
          async function parseActions(actionsStr) {
              const actions = [];
              const parts = actionsStr.split(';');
              
              for (const part of parts) {
                  if (part.startsWith('wait:')) {
                      const seconds = parseInt(part.split(':')[1]);
                      actions.push({ type: 'wait', duration: seconds });
                  }
                  else if (part.startsWith('scroll:')) {
                      const pixels = parseInt(part.split(':')[1]);
                      actions.push({ type: 'scroll', y: pixels });
                  }
                  else if (part.startsWith('click:')) {
                      const selector = part.substring(6);
                      actions.push({ type: 'click', selector });
                  }
                  else if (part.startsWith('type:')) {
                      const [_, text] = part.split(':');
                      actions.push({ type: 'type', text });
                  }
                  else if (part.startsWith('press:')) {
                      const key = part.split(':')[1];
                      actions.push({ type: 'press', key });
                  }
                  else if (part === 'screenshot') {
                      actions.push({ type: 'screenshot' });
                  }
                  else if (part === 'fullpage') {
                      actions.push({ type: 'fullpage' });
                  }
                  else if (part.startsWith('evaluate:')) {
                      const code = part.substring(9);
                      actions.push({ type: 'evaluate', code });
                  }
              }
              return actions;
          }
          
          async function performAction(page, action, stepNum) {
              console.log(`  🎬 Step ${stepNum}: ${action.type}`);
              
              switch (action.type) {
                  case 'wait':
                      console.log(`     ⏳ Waiting ${action.duration}s...`);
                      await page.waitForTimeout(action.duration * 1000);
                      break;
                      
                  case 'scroll':
                      console.log(`     📜 Scrolling ${action.y}px`);
                      await page.evaluate((y) => window.scrollBy(0, y), action.y);
                      break;
                      
                  case 'click':
                      console.log(`     🖱️ Clicking: ${action.selector}`);
                      try {
                          await page.waitForSelector(action.selector, { timeout: 5000 });
                          await page.click(action.selector);
                          console.log(`     ✅ Clicked successfully`);
                      } catch(e) {
                          console.log(`     ❌ Selector not found: ${action.selector}`);
                      }
                      break;
                      
                  case 'type':
                      console.log(`     ⌨️ Typing: ${action.text}`);
                      await page.keyboard.type(action.text);
                      break;
                      
                  case 'press':
                      console.log(`     ⌨️ Pressing key: ${action.key}`);
                      await page.keyboard.press(action.key);
                      break;
                      
                  case 'screenshot':
                      const filename = `screenshot_${Date.now()}.png`;
                      await page.screenshot({ path: filename, fullPage: false });
                      console.log(`     📸 Screenshot saved: ${filename}`);
                      break;
                      
                  case 'fullpage':
                      const fullFilename = `fullpage_${Date.now()}.png`;
                      await page.screenshot({ path: fullFilename, fullPage: true });
                      console.log(`     📸 Full page screenshot: ${fullFilename}`);
                      break;
                      
                  case 'evaluate':
                      console.log(`     🔧 Executing: ${action.code.substring(0, 50)}...`);
                      const result = await page.evaluate(action.code);
                      console.log(`     📊 Result: ${result}`);
                      break;
              }
          }
          
          async function main() {
              console.log('🚀 Launching browser...');
              const browser = await puppeteer.launch({
                  headless: true,
                  args: ['--no-sandbox', '--disable-setuid-sandbox']
              });
              
              const page = await browser.newPage();
              
              // Set viewport
              await page.setViewport({ width: 1280, height: 800 });
              
              console.log(`🌐 Navigating to: ${url}`);
              await page.goto(url, { waitUntil: 'networkidle2', timeout: 30000 });
              console.log('✅ Page loaded');
              
              // Save initial HTML
              const html = await page.content();
              require('fs').writeFileSync('initial_page.html', html);
              console.log('📄 Initial HTML saved');
              
              // Parse and perform actions
              const actions = await parseActions(actionsStr);
              console.log(`\n📋 Total actions: ${actions.length}\n`);
              
              for (let i = 0; i < actions.length; i++) {
                  await performAction(page, actions[i], i + 1);
                  await page.waitForTimeout(500); // Small delay between actions
              }
              
              // Save final state
              const finalHtml = await page.content();
              require('fs').writeFileSync('final_page.html', finalHtml);
              console.log('\n📄 Final HTML saved');
              
              // Save console logs
              page.on('console', msg => console.log('🌐 Console:', msg.text()));
              
              // Extract all links after interactions
              const links = await page.evaluate(() => {
                  return Array.from(document.querySelectorAll('a')).map(a => a.href);
              });
              require('fs').writeFileSync('extracted_links.json', JSON.stringify(links, null, 2));
              console.log(`🔗 Extracted ${links.length} links`);
              
              // Take final screenshot
              await page.screenshot({ path: 'final_screenshot.png', fullPage: true });
              console.log('📸 Final screenshot saved');
              
              await browser.close();
              console.log('\n✅ Session completed successfully!');
          }
          
          main().catch(console.error);
          EOF
          
          export URL="${{ github.event.inputs.url }}"
          export ACTIONS="${{ github.event.inputs.actions }}"
          
          node interact.js
          
      - name: Save Results
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          FOLDER="interactions/${TIMESTAMP}"
          mkdir -p "$FOLDER"
          
          # Move all generated files
          mv *.png *.html *.json "$FOLDER/" 2>/dev/null || true
          
          # Create report
          cat > "$FOLDER/report.md" << EOF
          # 🎮 Interaction Report
          
          **URL:** ${{ github.event.inputs.url }}
          **Time:** $(date)
          **Actions:** ${{ github.event.inputs.actions }}
          
          ## Files Generated:
          - [Initial HTML](./initial_page.html)
          - [Final HTML](./final_page.html)
          - [Final Screenshot](./final_screenshot.png)
          - [Extracted Links](./extracted_links.json)
          
          ## Page Information:
          EOF
          
          echo "✅ Results saved to: $FOLDER"
          
      - name: Commit Results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add interactions/
          git diff --cached --quiet || {
              git commit -m "[AVASAM] Interactive session: ${{ github.event.inputs.url }} [skip ci]"
              git push
          }
